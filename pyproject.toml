[project]
name = "sobornyi-bot"
version = "1.1.0"
description = "Telegram bot to control the Sobornyi group"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "dynaconf==3.2.10",
    "python-telegram-bot[callback-data,job-queue]==22.0",
]

[dependency-groups]
dev = [
    "black==25.1.0",
    "isort==6.0.1",
    "pre-commit==4.1.0",
    "pyright==1.1.408",
    "pytest==8.3.4",
    "pytest-asyncio==0.23.5",
    "pytest-cov==4.1.0",
    "pytest-env==1.1.5",
    "pytest-testmon==2.1.3",
    "pytest-watcher==0.6.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
addopts = "-v"
markers = [
    "asyncio: marks a test as an asyncio coroutine",
    "integration: marks a test as an integration test (deselect with '-m \"not integration\"')",
]
env = ["DYNACONF_ENV=dev"]
asyncio_mode = "auto"
filterwarnings = ["ignore::telegram.warnings.PTBUserWarning"]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/site-packages/*",
    "*/dist-packages/*",
    "*/tests/*",
    "*/__pycache__/*",
    "*/.pytest_cache/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "raise ImportError",
    "except ImportError",
    "raise AssertionError",
]

[tool.black]
target-version = ["py313"]

[tool.isort]
profile = "black"
